<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>对话</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --blur: blur(24px) saturate(180%);
  --glass: rgba(255,255,255,0.72);
  --glass-dark: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.3);
  --bg-grad: linear-gradient(145deg, #e8eaf6 0%, #fce4ec 40%, #e3f2fd 100%);
  --text: #1c1c1e;
  --text-secondary: #6e6e73;
  --accent: #007aff;
  --accent-light: rgba(0,122,255,0.12);
  --bubble-user: #007aff;
  --bubble-ai: rgba(255,255,255,0.85);
  --shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
  --radius: 20px;
}

body {
  background: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 动态背景光晕 */
body::before {
  content: '';
  position: fixed;
  width: 60vw; height: 60vw;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(120,140,255,0.18) 0%, transparent 70%);
  top: -15vw; left: -10vw;
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  width: 50vw; height: 50vw;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,150,180,0.15) 0%, transparent 70%);
  bottom: 5vw; right: -10vw;
  pointer-events: none;
  z-index: 0;
}

/* 顶栏 */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 12px;
  padding-top: calc(14px + env(safe-area-inset-top));
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--glass-border);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
  box-shadow: var(--shadow-sm);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: white; font-weight: 600;
  box-shadow: 0 2px 8px rgba(102,126,234,0.4);
  flex-shrink: 0;
}

.header-info h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
}

.provider-badge {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 1px;
}

.header-btn {
  background: var(--glass-dark);
  border: 1px solid var(--glass-border);
  color: var(--accent);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  transition: all 0.2s;
}
.header-btn:active { opacity: 0.7; transform: scale(0.96); }

/* 设置面板 */
#settings-panel {
  display: none;
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--glass-border);
  padding: 16px 18px;
  gap: 14px;
  flex-direction: column;
  flex-shrink: 0;
  position: relative;
  z-index: 9;
  box-shadow: var(--shadow-sm);
}
#settings-panel.open { display: flex; }

.setting-group {
  background: rgba(255,255,255,0.6);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--glass-border);
}

.setting-row {
  display: flex;
  align-items: center;
  padding: 11px 14px;
  gap: 10px;
  border-bottom: 1px solid rgba(0,0,0,0.05);
}
.setting-row:last-child { border-bottom: none; }

.setting-row label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  width: 72px;
  flex-shrink: 0;
}

.setting-row input,
.setting-row select {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 13px;
  outline: none;
  font-family: inherit;
  text-align: right;
}
.setting-row select { cursor: pointer; }
.setting-row input::placeholder { color: #aaa; }

.save-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 12px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
}
.save-btn:active { opacity: 0.85; transform: scale(0.98); }

/* 消息区 */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  z-index: 1;
  -webkit-overflow-scrolling: touch;
}

#messages::-webkit-scrollbar { display: none; }

/* 日期分割 */
.date-divider {
  text-align: center;
  font-size: 11px;
  color: var(--text-secondary);
  margin: 4px 0 8px;
}

/* 消息气泡 */
.msg-row {
  display: flex;
  flex-direction: column;
  max-width: 78%;
}
.msg-row.user { align-self: flex-end; align-items: flex-end; }
.msg-row.ai { align-self: flex-start; align-items: flex-start; }

.msg-name {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 3px;
  padding: 0 4px;
}

.bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: var(--shadow-sm);
}

.msg-row.user .bubble {
  background: var(--bubble-user);
  color: white;
  border-bottom-right-radius: 5px;
}

.msg-row.ai .bubble {
  background: var(--bubble-ai);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  color: var(--text);
  border-bottom-left-radius: 5px;
  border: 1px solid var(--glass-border);
}

.msg-time {
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 3px;
  padding: 0 4px;
}

/* 输入中动画 */
.typing-bubble {
  background: var(--bubble-ai);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  padding: 12px 16px;
  border-radius: 18px;
  border-bottom-left-radius: 5px;
  box-shadow: var(--shadow-sm);
  display: flex;
  gap: 5px;
  align-items: center;
}
.typing-bubble span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-secondary);
  animation: bounce 1.2s infinite;
  opacity: 0.5;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-4px); opacity: 1; }
}

/* 系统消息 */
.sys-msg {
  text-align: center;
  font-size: 12px;
  color: var(--text-secondary);
  background: rgba(255,255,255,0.5);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border-radius: 10px;
  padding: 5px 12px;
  align-self: center;
  border: 1px solid var(--glass-border);
}

/* 空状态 */
#empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--text-secondary);
  pointer-events: none;
  padding-bottom: 60px;
}
#empty .emoji { font-size: 44px; }
#empty p { font-size: 14px; }

/* 输入区 */
#input-area {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px 14px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
  border-top: 1px solid var(--glass-border);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
}

#input {
  flex: 1;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--glass-border);
  color: var(--text);
  font-size: 15px;
  padding: 10px 14px;
  border-radius: 22px;
  outline: none;
  resize: none;
  max-height: 110px;
  min-height: 42px;
  line-height: 1.5;
  font-family: inherit;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
}
#input:focus {
  border-color: rgba(0,122,255,0.4);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.04), 0 0 0 3px rgba(0,122,255,0.1);
}
#input::placeholder { color: #aaa; }

#send-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 17px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 10px rgba(0,122,255,0.35);
  transition: all 0.2s;
}
#send-btn:active { transform: scale(0.92); opacity: 0.85; }
#send-btn:disabled { background: #c7c7cc; box-shadow: none; cursor: not-allowed; }

/* Provider 颜色 */
.provider-claude { color: #c96a30; }
.provider-openai { color: #10a37f; }
.provider-deepseek { color: #4d6bfe; }
.provider-glm { color: #7b4fd4; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="avatar" id="avatar">透</div>
    <div class="header-info">
      <h1 id="header-title">对话</h1>
      <div class="provider-badge" id="provider-badge">未配置</div>
    </div>
  </div>
  <button class="header-btn" id="settings-btn">设置</button>
</header>

<div id="settings-panel">
  <div class="setting-group">
    <div class="setting-row">
      <label>服务商</label>
      <select id="provider">
        <option value="claude">Claude (Anthropic)</option>
        <option value="openai">GPT (OpenAI)</option>
        <option value="deepseek">DeepSeek</option>
        <option value="glm">GLM (智谱)</option>
      </select>
    </div>
    <div class="setting-row">
      <label>API Key</label>
      <input type="password" id="api-key" placeholder="粘贴你的 key" autocomplete="off" />
    </div>
    <div class="setting-row">
      <label>模型</label>
      <input type="text" id="model" placeholder="留空使用默认模型" />
    </div>
    <div class="setting-row">
      <label>系统提示</label>
      <input type="text" id="system-prompt" placeholder="可选" />
    </div>
  </div>
  <button class="save-btn" id="save-btn">保存</button>
</div>

<div id="messages">
  <div id="empty">
    <div class="emoji">💬</div>
    <p>配置 API Key 后开始对话</p>
  </div>
</div>

<div id="input-area">
  <textarea id="input" placeholder="发消息…" rows="1"></textarea>
  <button id="send-btn" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
    </svg>
  </button>
</div>

<script>
// ── 配置 ──────────────────────────────────────────────
const PROVIDERS = {
  claude:   { name: 'Claude',    defaultModel: 'claude-sonnet-4-6',              color: '#c96a30' },
  openai:   { name: 'GPT',       defaultModel: 'gpt-4o',                          color: '#10a37f' },
  deepseek: { name: 'DeepSeek',  defaultModel: 'deepseek-chat',                   color: '#4d6bfe' },
  glm:      { name: 'GLM',       defaultModel: 'glm-4-flash',                     color: '#7b4fd4' },
};

const ENDPOINTS = {
  claude:   'https://api.anthropic.com/v1/messages',
  openai:   'https://api.openai.com/v1/chat/completions',
  deepseek: 'https://api.deepseek.com/v1/chat/completions',
  glm:      'https://open.bigmodel.cn/api/paas/v4/chat/completions',
};

// ── 状态 ──────────────────────────────────────────────
let config = {
  provider:     localStorage.getItem('provider')     || 'claude',
  apiKey:       localStorage.getItem('apiKey')       || '',
  model:        localStorage.getItem('model')        || '',
  systemPrompt: localStorage.getItem('systemPrompt') || '',
};
let history = [];
let isLoading = false;

// ── DOM ───────────────────────────────────────────────
const settingsBtn   = document.getElementById('settings-btn');
const settingsPanel = document.getElementById('settings-panel');
const providerSel   = document.getElementById('provider');
const apiKeyInput   = document.getElementById('api-key');
const modelInput    = document.getElementById('model');
const systemInput   = document.getElementById('system-prompt');
const saveBtn       = document.getElementById('save-btn');
const messagesEl    = document.getElementById('messages');
const inputEl       = document.getElementById('input');
const sendBtn       = document.getElementById('send-btn');
const emptyEl       = document.getElementById('empty');
const avatarEl      = document.getElementById('avatar');
const headerTitle   = document.getElementById('header-title');
const providerBadge = document.getElementById('provider-badge');

// ── 初始化 ────────────────────────────────────────────
function init() {
  providerSel.value   = config.provider;
  apiKeyInput.value   = config.apiKey;
  modelInput.value    = config.model;
  systemInput.value   = config.systemPrompt;
  updateHeader();
  updateSendBtn();
}

function updateHeader() {
  const p = PROVIDERS[config.provider];
  avatarEl.style.background = `linear-gradient(135deg, ${p.color}cc, ${p.color})`;
  headerTitle.textContent = p.name;
  providerBadge.textContent = config.model || p.defaultModel;
  providerBadge.className = `provider-badge provider-${config.provider}`;
}

function updateSendBtn() {
  sendBtn.disabled = !config.apiKey || isLoading;
}

// ── 设置 ──────────────────────────────────────────────
settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

saveBtn.addEventListener('click', () => {
  config.provider     = providerSel.value;
  config.apiKey       = apiKeyInput.value.trim();
  config.model        = modelInput.value.trim();
  config.systemPrompt = systemInput.value.trim();

  localStorage.setItem('provider',     config.provider);
  localStorage.setItem('apiKey',       config.apiKey);
  localStorage.setItem('model',        config.model);
  localStorage.setItem('systemPrompt', config.systemPrompt);

  settingsPanel.classList.remove('open');
  updateHeader();
  updateSendBtn();
  addSysMsg('设置已保存 ✓');
});

// ── 输入框 ────────────────────────────────────────────
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

sendBtn.addEventListener('click', send);

// ── UI helpers ────────────────────────────────────────
function removeEmpty() {
  if (emptyEl && emptyEl.parentNode) emptyEl.remove();
}

function now() {
  return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function addSysMsg(text) {
  removeEmpty();
  const el = document.createElement('div');
  el.className = 'sys-msg';
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollDown();
}

function addMsg(role, text) {
  removeEmpty();
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');

  if (role === 'assistant') {
    const name = document.createElement('div');
    name.className = 'msg-name';
    name.textContent = PROVIDERS[config.provider].name;
    row.appendChild(name);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = now();
  row.appendChild(time);

  messagesEl.appendChild(row);
  scrollDown();
  return bubble;
}

function addTyping() {
  removeEmpty();
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  const name = document.createElement('div');
  name.className = 'msg-name';
  name.textContent = PROVIDERS[config.provider].name;
  row.appendChild(name);
  const b = document.createElement('div');
  b.className = 'typing-bubble';
  b.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(b);
  messagesEl.appendChild(row);
  scrollDown();
  return row;
}

function scrollDown() {
  messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
}

// ── API 调用 ──────────────────────────────────────────
async function callClaude(model, messages, system, key) {
  const body = { model, max_tokens: 2048, messages };
  if (system) body.system = system;
  const res = await fetch(ENDPOINTS.claude, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data?.error?.message || res.status);
  return data.content?.[0]?.text || '';
}

async function callOpenAI(endpoint, model, messages, system, key) {
  const msgs = system ? [{ role: 'system', content: system }, ...messages] : messages;
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + key,
    },
    body: JSON.stringify({ model, messages: msgs, max_tokens: 2048 }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data?.error?.message || res.status);
  return data.choices?.[0]?.message?.content || '';
}

// ── 发送 ──────────────────────────────────────────────
async function send() {
  const text = inputEl.value.trim();
  if (!text || isLoading || !config.apiKey) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  isLoading = true;
  updateSendBtn();
  const typingEl = addTyping();

  const p = config.provider;
  const model = config.model || PROVIDERS[p].defaultModel;

  try {
    let reply = '';
    if (p === 'claude') {
      reply = await callClaude(model, history, config.systemPrompt, config.apiKey);
    } else {
      reply = await callOpenAI(ENDPOINTS[p], model, history, config.systemPrompt, config.apiKey);
    }
    typingEl.remove();
    addMsg('assistant', reply);
    history.push({ role: 'assistant', content: reply });
  } catch (e) {
    typingEl.remove();
    addSysMsg('出错了：' + e.message);
    history.pop();
  } finally {
    isLoading = false;
    updateSendBtn();
    inputEl.focus();
  }
}

init();
</script>
</body>
</html>
